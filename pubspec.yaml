name: flowerarprototype
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.0
  camera: ^0.10.5+9
  path_provider: ^2.1.3
  google_fonts: 6.3.2
  flutter_animate: ^4.5.0
  image: ^4.2.0
  model_viewer_plus: ^1.7.0
  mobile_scanner: ^5.1.0
  barcode_widget: ^2.0.4
  share_plus: ^10.1.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.3.7
  intl: ^0.19.0
  http: ^1.2.1
  image_picker: ^1.0.4
  url_launcher: ^6.2.5
  app_links: ^6.3.2
  geolocator: ^11.0.0
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  path: ^1.9.1
  pdf: ^3.11.1
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  build_runner: 2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/models/lily.glb
    - assets/models/Rose.glb
    - assets/models/Sunflower.glb
    - assets/models/flowerBear.glb
    - assets/images/logo.jpg